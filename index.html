<style>

      --shadow:none;
    }
  }
  *{box-sizing:border-box}

  }
  .wrap{max-width:1080px; margin:0 auto; padding:32px 20px 80px}
  header h1{font-size:24px; margin:0 0 6px; letter-spacing:-.02em}
  header p{margin:0; color:var(--muted); font-size:13px}
  .toolbar{
    position:sticky; top:0; z-index:10; margin:24px -20px 0; padding:16px 20px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .row+.row{margin-top:10px}
  input[type=search],select{
    font:inherit; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  }
  input[type=search]{flex:1; min-width:200px}
  input[type=search]:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .chip{
    font:inherit; font-size:13px; cursor:pointer; user-select:none;
    background:var(--card); color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 13px;
  }
  .chip[aria-pressed=true]{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
  .count{margin:20px 0 12px; font-size:13px; color:var(--muted)}
  .count b{color:var(--fg)}
  ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  li a.card{
    display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    box-shadow:var(--shadow); transition:transform .12s ease,border-color .12s ease;
  }
  li a.card:hover{transform:translateY(-1px); border-color:var(--accent)}
  .top{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px}
  .company{font-size:13px; font-weight:600; color:var(--muted)}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.02em}
  .badge.new{background:var(--new-soft); color:var(--new)}
  .badge.src{background:var(--accent-soft); color:var(--accent)}
  .title{font-size:16px; font-weight:600; letter-spacing:-.01em; margin:0 0 8px}
  .meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
  .empty{padding:64px 0; text-align:center; color:var(--muted)}
  footer{margin-top:40px; font-size:12px; color:var(--muted); text-align:center}
</style>
</head>

  <ul id="list"></ul>

</div>

const jobs = DATA.jobs;

const state = { q:"", sort:"new", sources:new Set(), regions:new Set(), onlyNew:false };

const uniq = (arr) => [...new Set(arr.filter(Boolean))];
const sources = uniq(jobs.map(j => j.sourceLabel)).sort();
const regions = uniq(jobs.map(j => j.regionGroup)).sort();

document.getElementById("sub").textContent =
  `${DATA.generatedAt} 기준 · 총 ${jobs.length}건 · ${DATA.master}`;
document.getElementById("foot").textContent =
  `run_all.py 실행 시마다 갱신됩니다 · NEW = 최근 ${DATA.newDays}일 내 처음 발견된 공고`;

function chip(label, on){
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    const next = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(next));
    on(next); render();
  };
  return b;
}

const bar = document.getElementById("filters");
bar.appendChild(chip("NEW만", v => state.onlyNew = v));
sources.forEach(s => bar.appendChild(chip(s, v => v ? state.sources.add(s) : state.sources.delete(s))));
regions.forEach(r => bar.appendChild(chip(r, v => v ? state.regions.add(r) : state.regions.delete(r))));

document.getElementById("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };

function match(j){
  if (state.onlyNew && !j.isNew) return false;
  if (state.sources.size && !state.sources.has(j.sourceLabel)) return false;
  if (state.regions.size && !state.regions.has(j.regionGroup)) return false;
  if (state.q && !(j.company + " " + j.title).toLowerCase().includes(state.q)) return false;
  return true;
}

function render(){
  let rows = jobs.filter(match);

  if (state.sort === "company") rows.sort((a,b) => a.company.localeCompare(b.company, "ko"));
  else if (state.sort === "deadline") rows.sort((a,b) => a.deadlineKey - b.deadlineKey);
  else rows.sort((a,b) => (b.firstSeen || "").localeCompare(a.firstSeen || ""));

  const list = document.getElementById("list");
  list.replaceChildren(...rows.map(card));
  document.getElementById("empty").hidden = rows.length > 0;
  document.getElementById("count").innerHTML =
    `<b>${rows.length}</b>건 표시 · NEW <b>${rows.filter(r => r.isNew).length}</b>건`;
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function card(j){
  const li = el("li");
  const a = el("a", "card");
  a.href = j.url || "#";
  if (j.url) { a.target = "_blank"; a.rel = "noopener noreferrer"; }

  const top = el("div", "top");
  top.appendChild(el("span", "company", j.company || "회사명 미상"));
  if (j.isNew) top.appendChild(el("span", "badge new", "NEW"));
  top.appendChild(el("span", "badge src", j.sourceLabel));
  a.appendChild(top);

  a.appendChild(el("h2", "title", j.title));

  const meta = el("div", "meta");
  if (j.region)   meta.appendChild(el("span", null, "📍 " + j.region));
  if (j.deadline) meta.appendChild(el("span", null, "🗓 " + j.deadline));
  if (j.firstSeen) meta.appendChild(el("span", null, "발견 " + j.firstSeen));
  if (j.dupSources.length) meta.appendChild(el("span", null, "중복: " + j.dupSources.join(", ")));
  a.appendChild(meta);

  li.appendChild(a);
  return li;
}

render();
</script>
