<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채용공고 모아보기</title>
<!-- 아이폰 사파리 "홈 화면에 추가"용. 없으면 아이콘이 페이지 스크린샷으로 잡히고
     주소창이 그대로 남습니다. 아이콘은 외부 파일을 못 쓰므로 SVG를 그대로 심습니다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="채용공고">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="원티드·잡코리아·점핏 채용공고를 한 곳에서 보고 저장·비교·지원관리">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232563eb'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-weight='700'%3E%EA%B3%B5%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%EA%B3%B5%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-soft:#e8efff; --new:#059669; --new-soft:#e6f6f0;
    --warn:#b45309; --warn-soft:#fef3c7;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1115; --card:#171a21; --fg:#e8eaed; --muted:#9aa1ad; --line:#262b35;
      --accent:#6f9dff; --accent-soft:#1c2740; --new:#34d399; --new-soft:#12301f;
      --warn:#fbbf24; --warn-soft:#2e2410; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
      "Malgun Gothic",system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  /* 목록은 왼쪽, 필터 패널은 오른쪽. 좁아지면 패널이 아래에서 올라오는 시트가 됩니다. */
  .shell{max-width:1240px; margin:0 auto; padding:0 16px; display:flex; gap:28px; align-items:flex-start}
  .main{order:1; flex:1 1 auto; min-width:0; padding:24px 0 96px}
  .panel{
    order:2; flex:0 0 316px; width:316px;
    position:sticky; top:0; max-height:100vh; overflow-y:auto; overscroll-behavior:contain;
    padding:24px 0 32px;
  }
  .panel-head h1{font-size:20px; margin:0 0 5px; letter-spacing:-.02em}
  .panel-head p{margin:0 0 18px; color:var(--muted); font-size:12.5px; line-height:1.6}
  .panel-close,.appbar,.backdrop{display:none}

  .fgroup{margin-bottom:15px}
  .fgroup>.lbl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .fgroup .chips+input{margin-top:6px}
  input[type=search],input[type=text],select{
    font:inherit; font-size:14px; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px;
    width:100%; min-width:0;
  }
  #reset{width:100%; margin-top:2px}
  .sync{margin-top:22px; padding-top:16px; border-top:1px solid var(--line)}
  .sync .hint{margin:0 0 9px; font-size:11.5px; color:var(--muted); line-height:1.6}
  .sync .btn{width:100%}
  .sync input{margin-bottom:8px}
  .syncrow{display:flex; gap:8px; margin-bottom:8px}
  .syncrow .btn{flex:1 1 0; min-width:0}
  #shareUrl{margin-top:8px; font-size:12px; color:var(--muted)}
  #shareMsg{margin:8px 0 0}

  /* 탭이 5개라 모바일에서는 줄바꿈 대신 가로 스크롤로 넘깁니다. */
  .tabs{
    display:flex; gap:6px; margin:0 0 4px; overflow-x:auto;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    font:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; flex:none;
    background:none; border:none; color:var(--muted);
    padding:8px 14px; border-radius:9px;
  }
  .tab[aria-selected=true]{background:var(--accent-soft); color:var(--accent)}
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .chip{
    font:inherit; font-size:13px; cursor:pointer; user-select:none; white-space:nowrap;
    background:var(--card); color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }
  .chip[aria-pressed=true]{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
  .btn{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    background:var(--accent); color:#fff; border:none; border-radius:9px; padding:9px 14px;
  }
  .btn:disabled{opacity:.4; cursor:default}
  .btn.ghost{background:var(--card); color:var(--fg); border:1px solid var(--line)}
  .btn.danger{background:#dc2626; color:#fff}

  .bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:16px 0 10px}

  /* 선택한 공고에 할 일. 체크할 때만 뜨고, 모바일에서는 화면 아래에 고정됩니다. */
  .actions{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    position:sticky; top:0; z-index:25; margin:0 0 10px; padding:10px 12px;
    background:var(--accent-soft); border:1px solid var(--line); border-radius:12px;
  }
  /* .actions에 display:flex를 주면 브라우저 기본 [hidden]{display:none}을 이깁니다. */
  .actions[hidden]{display:none}
  .actions .picked{font-size:13px; font-weight:600; color:var(--accent); margin-right:auto}

  /* 카드의 옵션 버튼 / 메모 */
  .opt{
    position:relative; flex:none; align-self:flex-start; margin-top:14px;
    font:inherit; font-size:12px; cursor:pointer; white-space:nowrap;
    background:var(--card); color:var(--muted);
    border:1px solid var(--line); border-radius:8px; padding:5px 9px;
  }
  .opt:hover{border-color:var(--accent); color:var(--accent)}
  .menu{
    position:absolute; right:0; top:100%; margin-top:4px; z-index:40;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 24px rgba(16,24,40,.16); overflow:hidden; min-width:118px;
  }
  .menu button{
    display:block; width:100%; text-align:left; font:inherit; font-size:13px;
    background:none; border:none; color:inherit; padding:9px 13px; cursor:pointer;
  }
  .menu button:hover{background:var(--accent-soft); color:var(--accent)}
  .note{
    margin:7px 0 0; padding:8px 10px; font-size:12.5px; line-height:1.6;
    background:var(--accent-soft); border-radius:9px; color:var(--fg); overflow-wrap:anywhere;
  }
  .note b{color:var(--muted); font-weight:600; font-size:11.5px}

  /* 지원 기록 */
  .rec{margin-top:8px; display:flex; gap:6px 12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
  .rec .k{color:var(--fg); font-weight:600}
  /* 메모는 한 줄 통째로. flex 항목으로 두면 결과 사이에 칩처럼 끼어 보입니다. */
  .rec .note{flex:1 1 100%; margin-top:2px}
  .optbig{width:100%; margin-top:9px; padding:9px; font-size:13px}

  /* 메모장 */
  .memo{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .memo.pinned{border-color:var(--accent); background:color-mix(in srgb,var(--accent-soft) 45%,var(--card))}
  .memo-head{display:flex; gap:8px; align-items:center; margin-bottom:6px}
  .memo-time{font-size:11.5px; color:var(--muted); margin-left:auto}
  /* 줄바꿈을 적은 그대로 보여줍니다. */
  .memo-text{margin:0; font-size:14px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere}
  .memo-acts{display:flex; gap:6px; margin-top:12px}
  .memo-acts .btn{flex:1; font-size:12.5px; padding:7px 10px}

  /* 지원 기록 모달 */
  .modal{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:16px}
  .modal .sheet{
    background:var(--bg); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:18px;
  }
  .modal h3{margin:0 0 3px; font-size:16px}
  .modal .who{margin:0 0 16px; font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
  .modal .fgroup{margin-bottom:14px}
  .modal textarea{
    font:inherit; font-size:14px; color:inherit; background:var(--card); width:100%;
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; min-height:64px; resize:vertical;
  }
  .modal .foot{display:flex; gap:8px; margin-top:6px}
  .modal .foot .btn{flex:1}
  .count{font-size:13px; color:var(--muted)}
  .count b{color:var(--fg)}

  ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  li.item{display:flex; gap:10px; align-items:flex-start}
  li.item>input[type=checkbox]{margin:18px 0 0; width:18px; height:18px; flex:none; accent-color:var(--accent)}
  a.card{
    flex:1 1 auto; min-width:0;
    display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow); transition:border-color .12s ease;
  }
  a.card:hover{border-color:var(--accent)}
  .cardwrap{flex:1 1 auto; min-width:0}
  .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:5px}
  .company{font-size:13px; font-weight:600; color:var(--muted); overflow-wrap:anywhere}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .badge.new{background:var(--new-soft); color:var(--new)}
  .badge.src{background:var(--accent-soft); color:var(--accent)}
  .badge.role{background:var(--line); color:var(--muted)}
  .badge.soon{background:var(--warn-soft); color:var(--warn)}
  .title{font-size:15.5px; font-weight:600; letter-spacing:-.01em; margin:0 0 7px; overflow-wrap:anywhere}
  .meta{display:flex; gap:4px 14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
  /* 비교함: 고른 공고를 나란히 놓고 필터 기준으로 항목별 평가 */
  ul.compare{grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); align-items:start}
  .cmp{
    flex:1 1 auto; min-width:0; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);
  }
  .cmp.best{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  .cmp-top{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px}
  .cmp-score{margin-left:auto; font-size:12px; font-weight:700; color:var(--accent); white-space:nowrap}
  .cmp h3{font-size:14.5px; font-weight:600; letter-spacing:-.01em; margin:0 0 9px; overflow-wrap:anywhere}
  .cmp h3 a{color:inherit; text-decoration:none}
  .cmp h3 a:hover{text-decoration:underline}
  .crit{display:flex; gap:7px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--line); font-size:12.5px}
  .crit .ck{flex:none; width:54px; color:var(--muted)}
  .crit .cv{flex:1; min-width:0; overflow-wrap:anywhere}
  .crit .dot{flex:none; width:6px; height:6px; border-radius:50%; margin-top:6px; background:var(--muted)}
  .crit.good .dot{background:var(--new)}
  .crit.ok .dot{background:var(--warn)}
  .crit.bad .dot{background:#dc2626}
  .crit.bad .cv{color:#dc2626}
  .cmp-sum{margin-top:10px; padding-top:9px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.65}

  .empty{padding:56px 16px; text-align:center; color:var(--muted); font-size:14px}
  footer{margin-top:32px; font-size:12px; color:var(--muted); text-align:center; line-height:1.8}

  /* 태블릿: 패널을 조금 좁혀 목록 폭을 지킵니다. */
  @media (max-width:1080px) and (min-width:900px){
    .shell{gap:20px}
    .panel{flex-basis:280px; width:280px}
  }

  /* 모바일/좁은 화면: 필터는 아래에서 올라오는 시트로 */
  @media (max-width:899px){
    .shell{display:block; padding:0 12px}
    .main{padding:0 0 96px}

    .appbar{
      display:flex; gap:10px; align-items:center;
      position:sticky; top:0; z-index:30; margin:0 -12px; padding:11px 12px;
      background:color-mix(in srgb,var(--bg) 92%,transparent);
      backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
    }
    .appbar-title{
      flex:1; min-width:0; font-size:16px; font-weight:700; letter-spacing:-.02em;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .appbar .btn{flex:none}
    .fabcount{
      display:inline-block; min-width:17px; margin-left:6px; padding:0 5px;
      background:rgba(255,255,255,.25); border-radius:999px;
      font-size:11px; line-height:17px; text-align:center;
    }

    .panel{
      order:0; position:fixed; inset:auto 0 0 0; width:auto; max-width:none; flex:none;
      max-height:86vh; z-index:60; background:var(--bg);
      border-top:1px solid var(--line); border-radius:18px 18px 0 0;
      padding:6px 16px calc(24px + env(safe-area-inset-bottom));
      transform:translateY(101%); transition:transform .24s ease;
      box-shadow:0 -8px 30px rgba(0,0,0,.22);
    }
    .panel.open{transform:none}
    /* 손잡이. 여기를 잡고 아래로 쓸어내리면 닫힙니다. */
    .panel::before{
      content:""; display:block; width:44px; height:5px; border-radius:3px;
      background:var(--muted); opacity:.45; margin:8px auto 14px;
    }
    .panel-head{position:relative; padding-right:34px}
    .panel-head h1{font-size:18px}
    .panel-close{
      display:block; position:absolute; top:-4px; right:-6px;
      width:32px; height:32px; padding:0; line-height:1;
      font:inherit; font-size:17px; cursor:pointer;
      background:none; border:none; color:var(--muted); border-radius:8px;
    }
    .backdrop:not([hidden]){
      display:block; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.42);
    }

    .bar{margin:12px 0 10px}
    .bar .btn{flex:1 1 auto}
    /* 체크는 목록 중간에서 하는데 버튼이 맨 위에만 있으면 매번 올라가야 합니다.
       필터 버튼처럼 화면 아래에 붙여 따라다니게 합니다. */
    .actions{
      position:fixed; inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;
      margin:0; z-index:45; border-radius:14px;
      background:color-mix(in srgb,var(--card) 94%,transparent);
      backdrop-filter:saturate(180%) blur(12px);
      box-shadow:0 6px 26px rgba(0,0,0,.22);
    }
    .actions .picked{width:100%; margin:0 0 2px}
    .actions .btn{flex:1 1 0; min-width:0}
    .title{font-size:15px}
    li.item>input[type=checkbox]{margin-top:16px}
  }

  @media (prefers-reduced-motion:reduce){
    .panel{transition:none}
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" hidden></div>
<div class="shell">
  <aside class="panel" id="panel" aria-label="검색 및 필터">
    <div class="panel-head">
      <h1>채용공고 모아보기</h1>
      <p id="sub"></p>
      <button class="panel-close" id="panelClose" aria-label="필터 닫기">✕</button>
    </div>

    <div class="fgroup">
      <label class="lbl" for="q">검색</label>
      <input type="search" id="q" placeholder="회사명 · 공고명" autocomplete="off">
    </div>
    <div class="fgroup">
      <label class="lbl" for="sort">정렬</label>
      <select id="sort">
        <option value="posted">최근 등록순</option>
        <option value="deadline">마감임박순</option>
        <option value="company">회사명순</option>
      </select>
    </div>
    <div class="fgroup"><span class="lbl">직군</span><div class="chips" id="f-role"></div></div>
    <div class="fgroup"><span class="lbl">지역</span><div class="chips" id="f-region"></div></div>
    <div class="fgroup"><span class="lbl">경력</span><div class="chips" id="f-career"></div></div>
    <div class="fgroup"><span class="lbl">등록</span><div class="chips" id="f-period"></div></div>
    <div class="fgroup">
      <label class="lbl" for="include">포함되는 단어</label>
      <div class="chips" id="f-stack"></div>
      <input type="text" id="include" placeholder="쉼표로 구분 (하나라도 있으면 표시)">
    </div>
    <div class="fgroup">
      <label class="lbl" for="exclude">제외할 단어</label>
      <input type="text" id="exclude" placeholder="쉼표로 구분 (하나라도 있으면 숨김)">
    </div>
    <button class="btn ghost" id="reset">필터 초기화</button>

    <div class="fgroup sync">
      <span class="lbl">저장리스트 · 비교함 동기화</span>
      <div id="syncBox"></div>
      <input type="text" id="shareUrl" readonly hidden aria-label="옮길 링크">
      <p class="hint" id="shareMsg" hidden></p>
    </div>
  </aside>

  <main class="main">
    <div class="appbar">
      <span class="appbar-title" aria-hidden="true">채용공고 모아보기</span>
      <button class="btn" id="panelToggle" aria-expanded="false" aria-controls="panel">
        필터<span class="fabcount" id="fabCount"></span>
      </button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-all" role="tab" aria-selected="true">전체</button>
      <button class="tab" id="tab-saved" role="tab" aria-selected="false">저장리스트</button>
      <button class="tab" id="tab-compare" role="tab" aria-selected="false">비교함</button>
      <button class="tab" id="tab-applied" role="tab" aria-selected="false">지원완료</button>
      <button class="tab" id="tab-memo" role="tab" aria-selected="false">메모장</button>
    </div>

    <div class="bar">
      <span class="count" id="count"></span>
      <span style="flex:1"></span>
      <button class="btn" id="newMemo" hidden>+ 새 메모</button>
      <button class="btn ghost" id="selectAll">전체선택</button>
    </div>

    <!-- 고른 공고에 할 일. 모바일에서는 화면 아래에 붙어 따라다닙니다. -->
    <div class="actions" id="actions" hidden>
      <span class="picked" id="picked"></span>
      <button class="btn" id="save">⭐ 저장</button>
      <button class="btn ghost" id="compare">⚖️ 비교</button>
      <button class="btn danger" id="remove" hidden>저장 취소</button>
      <button class="btn danger" id="uncompare" hidden>비교함에서 빼기</button>
      <button class="btn danger" id="unapply" hidden>지원완료 취소</button>
      <button class="btn danger" id="delMemo" hidden>선택삭제</button>
      <button class="btn ghost" id="pinMemo" hidden>📌 상단고정</button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>

    <footer id="foot"></footer>
  </main>

const KEY_SAVED = "jobboard.saved";
const KEY_COMPARE = "jobboard.compare";
const KEY_APPLIED = "jobboard.applied";      // 지원완료한 공고 (객체째)
const KEY_NOTES = "jobboard.notes";          // 공고별 메모 {id: 메모}
const KEY_APPINFO = "jobboard.appinfo";      // 지원 기록 {id: {지원일·플랫폼·결과…}}
const KEY_MEMOS = "jobboard.memos";          // 공고와 무관한 메모장
const KEY_TOUCHED = "jobboard.touched";      // 이 기기에서 마지막으로 바뀐 시각
const KEY_PREFS = "jobboard.prefs";
const DEFAULT_EXCLUDE = "구로구, 가산, 구로, 강서";
const DEFAULT_INCLUDE = "";
const DEFAULT_REGIONS = ["서울시", "성남시", "하남시"];
const DEFAULT_ROLES = ["프론트엔드"];
const DEFAULT_CAREERS = ["신입"];
const DEFAULT_PERIOD = 30;
const STACKS = ["react", "typescript", "next.js"];
const DEFAULT_STACKS = ["react", "typescript"];

const store = {
  read(key, fallback){
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
    catch (e) { return fallback; }
  },
  write(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  },
};

// 저장한 공고는 원본이 목록에서 빠져도 남도록 객체째 보관합니다. 비교함도 같은 방식.
let saved = store.read(KEY_SAVED, []);
let compared = store.read(KEY_COMPARE, []);
let applied = store.read(KEY_APPLIED, []);
let notes = store.read(KEY_NOTES, {});
let appliedInfo = store.read(KEY_APPINFO, {});
let memos = store.read(KEY_MEMOS, []);
const prefs = store.read(KEY_PREFS, {});

const state = {
  view: "all",
  q: "",
  sort: "posted",
  roles: new Set(DEFAULT_ROLES),
  regions: new Set(DEFAULT_REGIONS),
  careers: new Set(DEFAULT_CAREERS),
  stacks: new Set(DEFAULT_STACKS),
  period: prefs.period === undefined ? DEFAULT_PERIOD : prefs.period,
  include: prefs.include === undefined ? DEFAULT_INCLUDE : prefs.include,
  exclude: prefs.exclude === undefined ? DEFAULT_EXCLUDE : prefs.exclude,
  picked: new Set(),
};

// 메모는 공고가 아니라서 URL이 없습니다. 자기 id를 먼저 봅니다.
const idOf = (j) => j.mid || j.url || (j.company + "|" + j.title);

document.getElementById("sub").textContent =
  `${DATA.generatedAt} 기준 · 전체 ${DATA.jobs.length}건 · ${DATA.master}`;
document.getElementById("foot").innerHTML =
  `NEW = 최근 ${DATA.newDays}일 내 처음 발견 · 저장리스트와 비교함은 이 브라우저에만 보관됩니다<br>` +
  `비교 점수는 지금 켜둔 필터를 기준으로 매겨지므로, 필터를 바꾸면 점수도 다시 계산됩니다<br>` +
  `등록일은 잡코리아만 실제 등록일이고, 원티드·점핏은 처음 발견한 날짜입니다`;

// quiet: 모달 안의 칩처럼 목록을 다시 그릴 필요가 없는 자리에서 씁니다.
function chip(parent, label, pressed, on, quiet){
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", String(!!pressed));
  b.onclick = () => {
    const next = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(next));
    on(next, b);
    if (!quiet) render();
  };
  parent.appendChild(b);
  return b;
}

// ── 필터 칩 ────────────────────────────────────
const ROLE_ORDER = ["프론트엔드", "퍼블리셔", "백엔드", "웹/풀스택", "앱", "데이터/AI", "기타"];
const roleChips = ROLE_ORDER.filter(r => DATA.jobs.some(j => j.roles.includes(r)))
  .map(r => chip(document.getElementById("f-role"), r, DEFAULT_ROLES.includes(r),
    on => on ? state.roles.add(r) : state.roles.delete(r)));

// 서울시·성남시·하남시는 처음부터 켜둡니다. 켠 지역만 보여주는 화이트리스트로 동작합니다.
const REGION_ORDER = [...DEFAULT_REGIONS, "그 외"];
const regionChips = REGION_ORDER.filter(r => DATA.jobs.some(j => j.regionGroup === r))
  .map(r => chip(document.getElementById("f-region"), r, DEFAULT_REGIONS.includes(r),
    on => on ? state.regions.add(r) : state.regions.delete(r)));

const careerChips = ["신입", "1~2년", "경력무관"]
  .map(c => chip(document.getElementById("f-career"), c, DEFAULT_CAREERS.includes(c),
    on => on ? state.careers.add(c) : state.careers.delete(c)));

// 포함단어 입력칸을 대신하는 단축 칩. 켜면 그 단어가 포함단어 목록에 더해집니다.
const stackChips = STACKS.map(s =>
  chip(document.getElementById("f-stack"), s, DEFAULT_STACKS.includes(s),
    on => on ? state.stacks.add(s) : state.stacks.delete(s)));

// 기본 선택값 중 그날 공고가 하나도 없는 항목은 칩이 안 생깁니다.
// 그대로 두면 끌 수 있는 칩이 없는데 필터는 계속 걸려 결과가 0건이 됩니다.
function syncToChips(set, chips){
  const labels = new Set(chips.map(c => c.textContent));
  [...set].forEach(v => { if (!labels.has(v)) set.delete(v); });
}
syncToChips(state.roles, roleChips);
syncToChips(state.regions, regionChips);
syncToChips(state.careers, careerChips);

const periodChips = [];
[[7, "1주일"], [14, "2주일"], [30, "30일"], [0, "전체"]].forEach(([days, label]) => {
  const b = chip(document.getElementById("f-period"), label, state.period === days, (on, self) => {
    periodChips.forEach(x => { if (x !== self) x.setAttribute("aria-pressed", "false"); });
    state.period = on ? days : 0;
    savePrefs();
  });
  b.dataset.days = String(days);
  periodChips.push(b);
});

const includeInput = document.getElementById("include");
includeInput.value = state.include;
includeInput.oninput = e => { state.include = e.target.value; savePrefs(); render(); };

const excludeInput = document.getElementById("exclude");
excludeInput.value = state.exclude;
excludeInput.oninput = e => { state.exclude = e.target.value; savePrefs(); render(); };

document.getElementById("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };

// 초기화는 "조건 없이 전부 보기"로 되돌립니다. 제외할 단어만 그대로 둡니다
// (보기 싫은 지역을 걸러두는 칸이라 초기화할 때마다 다시 적기 번거롭습니다).
document.getElementById("reset").onclick = () => {
  state.roles.clear();
  state.regions.clear();
  state.careers.clear();
  state.stacks.clear();
  state.q = ""; state.period = 0; state.include = "";
  document.getElementById("q").value = "";
  includeInput.value = "";

  [roleChips, regionChips, careerChips, stackChips].forEach(chips =>
    chips.forEach(c => c.setAttribute("aria-pressed", "false")));
  periodChips.forEach(c => c.setAttribute("aria-pressed", String(c.dataset.days === "0")));
  savePrefs(); render();
};

function savePrefs(){
  store.write(KEY_PREFS, {period: state.period, include: state.include, exclude: state.exclude});
}

// ── 탭 ────────────────────────────────────────
const tabAll = document.getElementById("tab-all");
const tabSaved = document.getElementById("tab-saved");
const tabCompare = document.getElementById("tab-compare");
const tabApplied = document.getElementById("tab-applied");
const tabMemo = document.getElementById("tab-memo");
tabAll.onclick = () => switchView("all");
tabSaved.onclick = () => switchView("saved");
tabCompare.onclick = () => switchView("compare");
tabApplied.onclick = () => switchView("applied");
tabMemo.onclick = () => switchView("memo");

function tabLabels(){
  tabSaved.textContent = `저장리스트${saved.length ? " " + saved.length : ""}`;
  tabCompare.textContent = `비교함${compared.length ? " " + compared.length : ""}`;
  tabApplied.textContent = `지원완료${applied.length ? " " + applied.length : ""}`;
  tabMemo.textContent = `메모장${memos.length ? " " + memos.length : ""}`;
}

function switchView(view){
  state.view = view;
  state.picked.clear();
  tabAll.setAttribute("aria-selected", String(view === "all"));
  tabSaved.setAttribute("aria-selected", String(view === "saved"));
  tabCompare.setAttribute("aria-selected", String(view === "compare"));
  tabApplied.setAttribute("aria-selected", String(view === "applied"));
  tabMemo.setAttribute("aria-selected", String(view === "memo"));
  tabLabels();
  const memoView = view === "memo";
  document.getElementById("newMemo").hidden = !memoView;
  document.getElementById("save").hidden = memoView || view === "saved";
  document.getElementById("compare").hidden = memoView || view === "compare";
  document.getElementById("delMemo").hidden = !memoView;
  document.getElementById("pinMemo").hidden = !memoView;
  document.getElementById("remove").hidden = view !== "saved";
  document.getElementById("uncompare").hidden = view !== "compare";
  document.getElementById("unapply").hidden = view !== "applied";
  render();
}

// ── 저장 / 비교함 담기 ─────────────────────────
document.getElementById("save").onclick = () => {
  const have = new Set(saved.map(idOf));
  const add = visible().filter(j => state.picked.has(idOf(j)) && !have.has(idOf(j)));
  saved = saved.concat(add);
  store.write(KEY_SAVED, saved);
  state.picked.clear();
  tabLabels();
  render();
  syncSoon();
};

document.getElementById("remove").onclick = () => {
  saved = saved.filter(j => !state.picked.has(idOf(j)));
  store.write(KEY_SAVED, saved);
  state.picked.clear();
  tabLabels();
  render();
  syncSoon();
};

document.getElementById("compare").onclick = () => {
  const have = new Set(compared.map(idOf));
  // 채점 결과(_ev)는 필터가 바뀔 때마다 다시 계산하므로 저장하지 않습니다.
  const add = visible()
    .filter(j => state.picked.has(idOf(j)) && !have.has(idOf(j)))
    .map(({_ev, ...rest}) => rest);
  compared = compared.concat(add);
  store.write(KEY_COMPARE, compared);
  state.picked.clear();
  tabLabels();
  render();
  syncSoon();
};

document.getElementById("newMemo").onclick = () => editMemo(null);

document.getElementById("delMemo").onclick = () => {
  const n = memos.filter(m => state.picked.has(m.mid)).length;
  if (!n || !confirm(`선택한 메모 ${n}건을 지울까요?`)) return;
  memos = memos.filter(m => !state.picked.has(m.mid));

  saveMemos();
};

document.getElementById("pinMemo").onclick = () => {
  // 고른 것 중 하나라도 안 고정돼 있으면 전부 고정, 다 고정이면 전부 해제합니다.
  const picked = memos.filter(m => state.picked.has(m.mid));
  if (!picked.length) return;
  const turnOn = picked.some(m => !m.pinned);
  picked.forEach(m => { m.pinned = turnOn; });
  saveMemos();
};

document.getElementById("unapply").onclick = () => {
  applied = applied.filter(j => !state.picked.has(idOf(j)));
  store.write(KEY_APPLIED, applied);
  state.picked.clear();
  tabLabels();
  render();
  syncSoon();
};

document.getElementById("uncompare").onclick = () => {
  compared = compared.filter(j => !state.picked.has(idOf(j)));
  store.write(KEY_COMPARE, compared);
  state.picked.clear();
  tabLabels();
  render();
  syncSoon();
};

document.getElementById("selectAll").onclick = () => {
  const rows = visible();
  const all = rows.length && rows.every(j => state.picked.has(idOf(j)));
  rows.forEach(j => all ? state.picked.delete(idOf(j)) : state.picked.add(idOf(j)));

};

// ── 필터 ──────────────────────────────────────
const headBlob = (j) => `${j.company} ${j.title} ${j.region}`.toLowerCase();
const fullBlob = (j) => `${headBlob(j)} ${j.stack || ""} ${j.body || ""}`.toLowerCase();

function splitWords(text){
  return text.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
}

function excludeWords(){ return splitWords(state.exclude); }

// 입력칸에 적은 단어 + 켜둔 스택 칩. 하나라도 걸리면 통과시킵니다.
function includeWords(){ return [...new Set([...splitWords(state.include), ...state.stacks])]; }

function match(j, words, incl){
  if (state.roles.size && !j.roles.some(r => state.roles.has(r))) return false;
  // 직군·경력과 같은 규칙입니다. 아무것도 안 켜면 지역 제한 없음.
  if (state.regions.size && !state.regions.has(j.regionGroup)) return false;
  if (state.careers.size && !j.careerTags.some(c => state.careers.has(c))) return false;
  if (state.period && j.age > state.period) return false;

  // 제외단어와 검색은 지금까지처럼 회사·제목·지역만 봅니다. 본문까지 보면
  // "구로" 같은 지역 제외어가 본문 한 줄에 걸려 멀쩡한 공고가 통째로 날아갑니다.
  const head = headBlob(j);
  if (words.some(w => head.includes(w))) return false;
  if (state.q && !head.includes(state.q)) return false;
  // 포함단어만 스킬·본문까지 훑습니다. 제목에 안 적힌 기술스택을 찾기 위한 칸입니다.
  if (incl.length && !incl.some(w => fullBlob(j).includes(w))) return false;
  return true;
}

function visible(){
  // 담아둔 목록(저장·비교·지원완료)에는 필터를 걸지 않습니다. 직접 고른 것들이라
  // 필터 때문에 8건 중 1건만 보이면 담아둔 의미가 없습니다.
  if (state.view === "compare"){
    const rows = compared.slice();
    rows.forEach(j => { j._ev = evaluate(j); });
    rows.sort((a, b) => b._ev.pct - a._ev.pct || a.company.localeCompare(b.company, "ko"));
    return rows;
  }
  // 메모장: 고정한 것부터, 그다음 최근 수정순.
  if (state.view === "memo"){
    return memos.slice().sort((a, b) =>
      (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updated || "").localeCompare(a.updated || ""));
  }
  if (state.view === "saved") return sortRows(saved.slice());
  if (state.view === "applied"){
    // 지원완료는 지원일이 최근인 것부터. 지원일을 안 적었으면 뒤로 보냅니다.
    return applied.slice().sort((a, b) =>
      (appliedInfo[idOf(b)]?.date || "").localeCompare(appliedInfo[idOf(a)]?.date || ""));
  }

  const pool = DATA.jobs;
  const words = excludeWords();
  const incl = includeWords();
  const rows = pool.filter(j => match(j, words, incl));

  return sortRows(rows);
}

function sortRows(rows){
  if (state.sort === "company") rows.sort((a, b) => a.company.localeCompare(b.company, "ko"));
  else if (state.sort === "posted") rows.sort((a, b) => a.age - b.age);
  else rows.sort((a, b) => a.deadlineKey - b.deadlineKey || a.company.localeCompare(b.company, "ko"));
  return rows;
}

// ── 비교 채점 ──────────────────────────────────
// AI 없이, 지금 켜둔 필터(직군·지역·경력·등록·포함단어)를 그대로 채점표로 씁니다.
// 켜지 않은 항목은 기준이 없으므로 점수에서 빼고 참고용으로만 보여줍니다.
function evaluate(j){
  const rows = [];
  const pros = [], cons = [];
  let score = 0, max = 0;

  const add = (key, level, text) => rows.push({key, level, text});

  if (state.roles.size){
    max += 2;
    const hit = j.roles.filter(r => state.roles.has(r));
    if (hit.length){ score += 2; add("직군", "good", hit.join(", ") + " 일치"); pros.push("직군 일치"); }
    else { add("직군", "bad", (j.roles.join(", ") || "직군 미상") + " — 고른 직군 아님"); cons.push("직군이 다름"); }
  } else {
    add("직군", "na", j.roles.join(", ") || "직군 미상");
  }

  if (state.regions.size){
    max += 2;
    if (state.regions.has(j.regionGroup)){ score += 2; add("지역", "good", j.region || j.regionGroup); pros.push("원하는 지역"); }
    else { add("지역", "bad", (j.region || j.regionGroup) + " — 고른 지역 밖"); cons.push("지역이 벗어남"); }
  } else {
    add("지역", "na", j.region || j.regionGroup);
  }

  if (state.careers.size){
    max += 2;
    const hit = j.careerTags.filter(c => state.careers.has(c));
    if (hit.length){ score += 2; add("경력", "good", (j.career || hit.join(", ")) + " — 지원 가능"); pros.push("경력 조건 맞음"); }
    else {
      add("경력", "bad", (j.career || "경력 조건 미표기") + " — 고른 조건과 안 맞음");
      cons.push(j.career ? "경력 요건이 높음" : "경력 조건이 안 적혀 있음");
    }
  } else {
    add("경력", "na", j.career || "경력 조건 미표기");
  }

  // 등록 신선도: 오래된 공고일수록 이미 사람을 뽑았을 가능성이 큽니다.
  max += 2;
  const posted = (j.posted || "?") + (j.postedReal ? "" : " (발견일)");
  if (j.age <= 7){ score += 2; add("등록", "good", `${posted} · ${j.age}일 전`); pros.push("따끈한 공고"); }
  else if (j.age <= 14){ score += 1.5; add("등록", "ok", `${posted} · ${j.age}일 전`); }
  else if (j.age <= 30){ score += 1; add("등록", "ok", `${posted} · ${j.age}일 전`); }
  else { add("등록", "bad", `${posted} · ${j.age}일 전 — 오래됨`); cons.push("등록된 지 오래됨"); }

  const incl = includeWords();
  if (incl.length){
    max += 2;
    const head = headBlob(j), skill = (j.stack || "").toLowerCase();
    const hit = incl.filter(w => fullBlob(j).includes(w));
    if (hit.length){
      score += Math.min(hit.length, 2);
      // 어디서 걸렸는지까지 알려줘야 "제목만 스친 건지 스킬에 박힌 건지" 구분이 됩니다.
      const where = hit.some(w => skill.includes(w)) ? "스킬"
        : hit.some(w => head.includes(w)) ? "제목" : "본문";
      add("포함단어", "good", `${hit.join(", ")} — ${where}에 있음`);
      pros.push(`${hit.join("·")} ${where} 일치`);
    } else {
      add("포함단어", "bad", "고른 단어가 공고 어디에도 없음");
      cons.push("찾는 키워드가 안 보임");
    }
  } else if (!j.stack && !j.body){
    // 스킬도 본문도 없는 공고는 포함단어를 켜면 불리해집니다. 미리 알려줍니다.
    add("스킬", "na", "스킬 정보 없음 — 제목으로만 판단됨");
  }

  // 마감 여유는 필터가 아니어도 지원 가능성에 직접 영향을 줍니다.
  max += 1.5;
  const left = Number((j.deadline.match(/D-(\d+)/) || [])[1]);
  if (j.deadline.includes("상시")){ score += 1.5; add("마감", "good", "상시채용 — 마감 압박 없음"); pros.push("상시채용"); }
  else if (left >= 14){ score += 1.5; add("마감", "good", `${j.deadline} — 준비할 시간 여유`); }
  else if (left >= 4){ score += 1; add("마감", "ok", j.deadline); }
  else if (j.deadline){ add("마감", "bad", `${j.deadline} — 서둘러야 함`); cons.push("마감이 임박"); }
  else { add("마감", "na", "마감 정보 없음"); }

  // 여러 사이트에 동시에 올린 공고는 그만큼 사람을 급히 찾는다는 신호로 봅니다.
  if (j.dupSources.length){
    score += 0.5;
    add("게시", "ok", `${j.dupSources.length + 1}곳에 게시 — 채용 의지 뚜렷`);
    pros.push("여러 사이트에 게시");
  }

  const pct = max ? Math.round((score / max) * 100) : 0;
  return {rows, score, max, pct, pros, cons};
}

// ── 렌더 ──────────────────────────────────────
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function card(j){
  const li = el("li", "item");

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.picked.has(idOf(j));
  box.setAttribute("aria-label", `${j.company} ${j.title} 선택`);
  box.onchange = () => {
    if (box.checked) state.picked.add(idOf(j)); else state.picked.delete(idOf(j));
    updateBar();
  };
  li.appendChild(box);

  const a = el("a", "card");
  a.href = j.url || "#";
  if (j.url) { a.target = "_blank"; a.rel = "noopener noreferrer"; }

  const top = el("div", "top");
  top.appendChild(el("span", "company", j.company || "회사명 미상"));
  if (j.isNew) top.appendChild(el("span", "badge new", "NEW"));
  top.appendChild(el("span", "badge src", j.sourceLabel));
  j.roles.filter(r => r !== "기타").forEach(r => top.appendChild(el("span", "badge role", r)));
  const left = Number((j.deadline.match(/D-(\d+)/) || [])[1]);
  if (left && left <= 7) top.appendChild(el("span", "badge soon", "마감임박"));
  a.appendChild(top);

  a.appendChild(el("h2", "title", j.title));

  const meta = el("div", "meta");
  if (j.region)   meta.appendChild(el("span", null, "📍 " + j.region));
  if (j.career)   meta.appendChild(el("span", null, "👤 " + j.career));
  if (j.stack)    meta.appendChild(el("span", null, "🧩 " + j.stack));
  if (j.deadline) meta.appendChild(el("span", null, "🗓 " + j.deadline));
  if (j.posted)   meta.appendChild(el("span", null, (j.postedReal ? "등록 " : "발견 ") + j.posted));
  if (j.dupSources.length) meta.appendChild(el("span", null, "중복: " + j.dupSources.join(", ")));
  a.appendChild(meta);

  // 메모는 카드(링크) 밖에 둡니다. 안에 넣으면 메모를 누를 때 공고가 열립니다.
  const wrap = el("div", "cardwrap");
  wrap.appendChild(a);
  const memo = notes[idOf(j)];
  if (memo){
    const note = el("div", "note");
    note.appendChild(el("b", null, "메모  "));
    note.appendChild(document.createTextNode(memo));
    wrap.appendChild(note);
  }
  if (state.view === "applied"){
    wrap.appendChild(recordView(j));
    const big = el("button", "btn ghost optbig", "옵션");
    big.onclick = () => openRecord(j);
    wrap.appendChild(big);
  }

  li.appendChild(wrap);
  li.appendChild(optionButton(j));
  return li;
}

// 카드마다 붙는 작은 "옵션" 버튼. 메모와 지원완료를 여기서 처리합니다.
function optionButton(j){
  const btn = el("button", "opt", "옵션");
  btn.onclick = (e) => {
    e.stopPropagation();
    if (btn.querySelector(".menu")) { btn.querySelector(".menu").remove(); return; }
    document.querySelectorAll(".menu").forEach(m => m.remove());

    const menu = el("div", "menu");
    const memoBtn = el("button", null, notes[idOf(j)] ? "메모 수정" : "메모");
    memoBtn.onclick = (ev) => { ev.stopPropagation(); menu.remove(); editNote(j); };
    menu.appendChild(memoBtn);

    const done = applied.some(x => idOf(x) === idOf(j));
    const applyBtn = el("button", null, done ? "지원완료 취소" : "지원완료");
    applyBtn.onclick = (ev) => { ev.stopPropagation(); menu.remove(); toggleApplied(j); };
    menu.appendChild(applyBtn);

    btn.appendChild(menu);
  };
  return btn;
}

function editNote(j){
  const now = notes[idOf(j)] || "";
  const next = prompt(`${j.company} — ${j.title}\n\n메모를 적어주세요. 비우면 지워집니다.`, now);
  if (next === null) return;
  if (next.trim()) notes[idOf(j)] = next.trim();
  else delete notes[idOf(j)];
  store.write(KEY_NOTES, notes);
  render(); syncSoon();
}

function toggleApplied(j){
  const id = idOf(j);
  if (applied.some(x => idOf(x) === id)){
    applied = applied.filter(x => idOf(x) !== id);
  } else {
    const {_ev, ...rest} = j;
    applied = applied.concat([rest]);
  }
  store.write(KEY_APPLIED, applied);
  tabLabels(); render(); syncSoon();
}

// ── 메모장 ────────────────────────────────────
// 공고에 붙는 메모와 별개로, 그냥 적어두는 곳입니다.
function newMemoId(){
  return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function stamp(){
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveMemos(){
  store.write(KEY_MEMOS, memos);
  tabLabels(); render(); syncSoon();
}

function editMemo(memo){
  const isNew = !memo;
  const draft = memo || {mid: newMemoId(), text: "", pinned: false};

  const modal = el("div", "modal");
  const sheet = el("div", "sheet");
  sheet.onclick = (e) => e.stopPropagation();
  modal.onclick = () => modal.remove();

  sheet.appendChild(el("h3", null, isNew ? "새 메모" : "메모 수정"));
  if (!isNew && draft.updated) sheet.appendChild(el("p", "who", "마지막 수정 " + draft.updated));

  const area = document.createElement("textarea");
  area.value = draft.text || "";
  area.style.minHeight = "180px";
  sheet.appendChild(area);

  const foot = el("div", "foot");
  const cancel = el("button", "btn ghost", "닫기");
  cancel.onclick = () => modal.remove();
  const ok = el("button", "btn", "저장");
  ok.onclick = () => {
    const text = area.value.trim();
    if (!text){
      // 빈 메모는 남겨봐야 목록만 어지럽힙니다. 있던 것이면 지웁니다.
      if (!isNew) memos = memos.filter(m => m.mid !== draft.mid);
      modal.remove(); saveMemos();
      return;
    }
    draft.text = text;
    draft.updated = stamp();
    if (isNew) memos = [draft, ...memos];
    modal.remove(); saveMemos();
  };
  foot.append(cancel, ok);
  sheet.appendChild(foot);

  modal.appendChild(sheet);
  document.body.appendChild(modal);
  area.focus();
}

function memoCard(m){
  const li = el("li", "item");

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.picked.has(m.mid);
  box.setAttribute("aria-label", "메모 선택");
  box.onchange = () => {
    if (box.checked) state.picked.add(m.mid); else state.picked.delete(m.mid);
    updateBar();
  };
  li.appendChild(box);

  const wrap = el("div", "cardwrap");
  const body = el("div", "memo" + (m.pinned ? " pinned" : ""));

  const head = el("div", "memo-head");
  if (m.pinned) head.appendChild(el("span", "badge new", "📌 고정"));
  head.appendChild(el("span", "memo-time", m.updated || ""));
  body.appendChild(head);

  body.appendChild(el("p", "memo-text", m.text));

  const acts = el("div", "memo-acts");
  const edit = el("button", "btn ghost", "수정");
  edit.onclick = () => editMemo(m);
  const pin = el("button", "btn ghost", m.pinned ? "고정 해제" : "상단고정");
  pin.onclick = () => { m.pinned = !m.pinned; saveMemos(); };
  const del = el("button", "btn ghost", "삭제");
  del.onclick = () => {
    if (!confirm("이 메모를 지울까요?")) return;
    memos = memos.filter(x => x.mid !== m.mid);
    state.picked.delete(m.mid);
    saveMemos();
  };
  acts.append(edit, pin, del);
  body.appendChild(acts);

  wrap.appendChild(body);
  li.appendChild(wrap);
  return li;
}

// ── 지원 기록 ─────────────────────────────────
const PLATFORMS = ["잡코리아", "사람인", "원티드", "링크드인", "기타"];
// O/X 말고 "기타"와 "체크삭제"를 둡니다. 결과가 애매하거나 잘못 눌렀을 때 필요합니다.
const MARKS = ["O", "X", "기타"];
const STEPS = [
  {key: "docOpen", label: "서류열람"},
  {key: "docResult", label: "서류결과"},
  {key: "interview", label: "면접결과"},
];

function recordView(j){
  const info = appliedInfo[idOf(j)] || {};
  const box = el("div", "rec");
  const put = (label, value) => {
    if (!value) return;
    const span = el("span");
    span.appendChild(el("b", "k", label + " "));
    span.appendChild(document.createTextNode(value));
    box.appendChild(span);
  };
  put("지원일", info.date);
  const platform = (info.platforms || []).map(p =>
    p === "기타" && info.platformEtc ? `기타(${info.platformEtc})` : p).join(", ");
  put("플랫폼", platform);
  STEPS.forEach(s => {
    const mark = info[s.key];
    if (!mark) return;
    put(s.label, mark === "기타" && info[s.key + "Etc"] ? `기타(${info[s.key + "Etc"]})` : mark);
  });
  if (info.memo){
    const note = el("div", "note");
    note.appendChild(el("b", null, "메모  "));
    note.appendChild(document.createTextNode(info.memo));
    box.appendChild(note);
  }
  return box;
}

function openRecord(j){
  const id = idOf(j);
  const draft = {...(appliedInfo[id] || {})};
  draft.platforms = [...(draft.platforms || [])];

  const modal = el("div", "modal");
  const sheet = el("div", "sheet");
  sheet.onclick = (e) => e.stopPropagation();
  modal.onclick = () => modal.remove();

  sheet.appendChild(el("h3", null, "지원 기록"));
  sheet.appendChild(el("p", "who", `${j.company} — ${j.title}`));

  const group = (label) => {
    const g = el("div", "fgroup");
    g.appendChild(el("span", "lbl", label));
    sheet.appendChild(g);
    return g;
  };

  // 지원일
  const dateBox = group("지원일");
  const date = document.createElement("input");
  date.type = "date";
  date.value = draft.date || "";
  date.onchange = () => { draft.date = date.value; };
  dateBox.appendChild(date);

  // 플랫폼 (여러 개 선택 가능)
  const platBox = group("플랫폼");
  const platChips = el("div", "chips");
  const etcInput = document.createElement("input");
  etcInput.type = "text";
  etcInput.placeholder = "어디에 지원했는지";
  etcInput.value = draft.platformEtc || "";
  etcInput.oninput = () => { draft.platformEtc = etcInput.value; };
  const syncEtc = () => { etcInput.hidden = !draft.platforms.includes("기타"); };
  PLATFORMS.forEach(p => {
    chip(platChips, p, draft.platforms.includes(p), on => {
      if (on) draft.platforms.push(p);
      else draft.platforms = draft.platforms.filter(x => x !== p);
      syncEtc();
    }, true);
  });
  platBox.appendChild(platChips);
  platBox.appendChild(etcInput);
  syncEtc();

  // 서류열람 / 서류결과 / 면접결과
  STEPS.forEach(step => {
    const g = group(step.label);
    const chips = el("div", "chips");
    const etc = document.createElement("input");
    etc.type = "text";
    etc.placeholder = "어떻게 됐는지";
    etc.value = draft[step.key + "Etc"] || "";
    etc.oninput = () => { draft[step.key + "Etc"] = etc.value; };
    const marks = [];
    const refresh = () => {
      marks.forEach(b => b.setAttribute("aria-pressed", String(draft[step.key] === b.textContent)));
      etc.hidden = draft[step.key] !== "기타";
    };
    MARKS.forEach(m => {
      // 하나만 고르는 자리라 다른 걸 누르면 이전 선택은 풀립니다.
      marks.push(chip(chips, m, draft[step.key] === m, () => { draft[step.key] = m; refresh(); }, true));
    });
    const clear = chip(chips, "체크삭제", false, () => {
      draft[step.key] = null;
      delete draft[step.key + "Etc"];
      etc.value = "";
      clear.setAttribute("aria-pressed", "false");
      refresh();
    }, true);
    g.appendChild(chips);
    g.appendChild(etc);
    refresh();
  });

  // 메모
  const memoBox = group("메모");
  const memo = document.createElement("textarea");
  memo.value = draft.memo || "";
  memo.oninput = () => { draft.memo = memo.value; };
  memoBox.appendChild(memo);

  const foot = el("div", "foot");
  const cancel = el("button", "btn ghost", "닫기");
  cancel.onclick = () => modal.remove();
  const save = el("button", "btn", "저장");
  save.onclick = () => {
    Object.keys(draft).forEach(k => {
      if (draft[k] === null || draft[k] === "" ||
          (Array.isArray(draft[k]) && !draft[k].length)) delete draft[k];
    });
    if (Object.keys(draft).length) appliedInfo[id] = draft;
    else delete appliedInfo[id];
    store.write(KEY_APPINFO, appliedInfo);
    store.write(KEY_MEMOS, memos);
    modal.remove();
    render(); syncSoon();
  };
  foot.append(cancel, save);
  sheet.appendChild(foot);

  modal.appendChild(sheet);
  document.body.appendChild(modal);
  date.focus();
}

function compareCard(j, best){
  const li = el("li", "item");

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.picked.has(idOf(j));
  box.setAttribute("aria-label", `${j.company} ${j.title} 선택`);
  box.onchange = () => {
    if (box.checked) state.picked.add(idOf(j)); else state.picked.delete(idOf(j));
    updateBar();
  };
  li.appendChild(box);

  const ev = j._ev;
  const wrap = el("div", "cmp" + (best ? " best" : ""));

  const top = el("div", "cmp-top");
  top.appendChild(el("span", "company", j.company || "회사명 미상"));
  if (best) top.appendChild(el("span", "badge new", "가장 유리"));
  top.appendChild(el("span", "cmp-score", `${ev.pct}점`));
  wrap.appendChild(top);

  const h = el("h3");
  if (j.url){
    const a = el("a", null, j.title);
    a.href = j.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    h.appendChild(a);
  } else h.textContent = j.title;
  wrap.appendChild(h);

  ev.rows.forEach(r => {
    const row = el("div", "crit " + r.level);
    row.appendChild(el("span", "dot"));
    row.appendChild(el("span", "ck", r.key));
    row.appendChild(el("span", "cv", r.text));
    wrap.appendChild(row);
  });

  const sum = el("div", "cmp-sum");
  sum.appendChild(el("div", null, ev.pros.length ? "유리: " + ev.pros.join(" · ") : "유리한 점이 뚜렷하지 않습니다"));
  if (ev.cons.length) sum.appendChild(el("div", null, "아쉬움: " + ev.cons.join(" · ")));
  wrap.appendChild(sum);

  li.appendChild(wrap);
  return li;
}

function updateBar(){
  const rows = visible();
  const picked = rows.filter(j => state.picked.has(idOf(j))).length;
  document.getElementById("count").innerHTML =
    `<b>${rows.length}</b>건 표시` +
    (picked ? ` · <b>${picked}</b>건 선택` : "") +
    (state.view === "all" ? ` · 저장 <b>${saved.length}</b>건 · 비교 <b>${compared.length}</b>건` : "");
  document.getElementById("selectAll").disabled = !rows.length;
  // 고를 게 있을 때만 띄웁니다. 항상 떠 있으면 모바일에서 목록을 가립니다.
  document.getElementById("actions").hidden = !picked;
  document.getElementById("picked").textContent = `${picked}건 선택`;

  // 시트를 닫아둔 모바일에서도 지금 몇 개가 걸려 있는지 보이게 합니다.
  // 기본값과 비교하지 않고 "실제로 걸린 조건" 수를 셉니다. 그래야 초기화하면
  // 제외 단어 하나만 남은 게 배지에 그대로 보입니다.
  const active =
    (state.roles.size ? 1 : 0) +
    (state.regions.size ? 1 : 0) +
    (state.careers.size ? 1 : 0) +
    (state.stacks.size ? 1 : 0) +
    (state.period ? 1 : 0) +
    (state.include.trim() ? 1 : 0) +
    (state.exclude.trim() ? 1 : 0) +
    (state.q ? 1 : 0);
  const badge = document.getElementById("fabCount");
  badge.textContent = active || "";
  badge.style.display = active ? "" : "none";
}

function render(){
  const rows = visible();
  const list = document.getElementById("list");
  const cmp = state.view === "compare";

  list.classList.toggle("compare", cmp);
  // 동점이면 아무거나 1등으로 세우지 않습니다. 공동 1위는 다 같이 표시하고,
  // 전부 같은 점수라 우열이 없으면 배지를 아예 달지 않습니다.
  const top = cmp && rows.length > 1 ? rows[0]._ev.pct : -1;
  const tiedAll = cmp && rows.every(j => j._ev.pct === top);
  list.replaceChildren(...(cmp
    ? rows.map(j => compareCard(j, !tiedAll && j._ev.pct === top))
    : state.view === "memo" ? rows.map(memoCard)
    : rows.map(card)));

  const empty = document.getElementById("empty");
  empty.hidden = rows.length > 0;
  empty.textContent = cmp
    ? "비교함이 비어 있습니다. 공고를 체크하고 ⚖️ 비교를 누르세요."
    : state.view === "saved"
      ? "저장한 공고가 없습니다. 공고를 체크하고 ⭐ 저장을 누르세요."
      : state.view === "applied"
        ? "지원완료한 공고가 없습니다. 공고의 옵션에서 '지원완료'를 누르세요."
      : state.view === "memo"
        ? "메모가 없습니다. '+ 새 메모'를 눌러 적어보세요."
        : "조건에 맞는 공고가 없습니다. 필터를 줄여보세요.";

  updateBar();
}

// ── 기기 간 옮기기 ────────────────────────────
// 서버가 없어서 저장리스트는 브라우저에만 남습니다. 목록을 통째로 링크에 실어
// 다른 기기에서 열면 옮겨지게 했습니다. 본문(body)은 검색용이고 덩치가 커서 뺍니다.
const b64url = {
  from(bytes){
    let s = "";
    bytes.forEach(b => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  to(text){
    const raw = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  },
};

const slim = (list) => list.map(({body, _ev, ...rest}) => rest);

async function packShare(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return "u" + b64url.from(bytes);
  const cs = new CompressionStream("gzip");
  const writer = cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  return "z" + b64url.from(new Uint8Array(buf));
}

async function unpackShare(text){
  const bytes = b64url.to(text.slice(1));
  if (text[0] === "u") return JSON.parse(new TextDecoder().decode(bytes));
  const ds = new DecompressionStream("gzip");
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  return JSON.parse(await new Response(ds.readable).text());
}

const shareMsg = document.getElementById("shareMsg");
const shareUrl = document.getElementById("shareUrl");

function showMsg(text){
  shareMsg.textContent = text;
  shareMsg.hidden = false;
}

// ── 기기 간 자동 동기화 (Supabase) ─────────────
// 동기화 코드를 아는 기기끼리 같은 목록을 봅니다. 코드가 곧 열쇠라서
// 코드를 아는 사람은 목록을 읽고 쓸 수 있습니다. 채용공고 목록이라 이 정도로 둡니다.
const SYNC = DATA.sync || null;
const KEY_CODE = "jobboard.synccode";
let syncCode = store.read(KEY_CODE, "");
let touchedAt = store.read(KEY_TOUCHED, "");
let syncTimer = null;

const syncHeaders = () => ({
  "apikey": SYNC.key,
  "Authorization": "Bearer " + SYNC.key,
  "Content-Type": "application/json",
});

function newCode(){
  const chars = "abcdefghijkmnpqrstuvwxyz23456789";   // 헷갈리는 l,o,0,1 제외
  const buf = crypto.getRandomValues(new Uint8Array(16));
  return [...buf].map(b => chars[b % chars.length]).join("");
}

// createIfMissing: 없는 코드면 지금 목록으로 새로 만들지 여부.
// 코드를 직접 입력해 "연결"할 때는 false여야 합니다. 오타를 낸 코드로 새 목록이
// 조용히 생기면 "동기화가 안 되네" 하고 헤매게 됩니다.
async function syncPull(createIfMissing = true){
  const url = `${SYNC.url}/rest/v1/job_lists?code=eq.${encodeURIComponent(syncCode)}&select=*`;
  const res = await fetch(url, {headers: syncHeaders()});
  if (!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
  const rows = await res.json();
  if (!rows.length){
    if (!createIfMissing){
      const bad = syncCode;
      syncCode = "";
      store.write(KEY_CODE, "");
      renderSyncBox();
      return `"${bad}" 코드를 찾지 못했습니다. 코드를 다시 확인해 주세요.`;
    }
    await syncPush();
    return "이 기기 목록을 새로 올렸습니다";
  }
  // 아직 서버에 못 올린 변경이 이 기기에 있으면 덮어쓰지 않고 올립니다.
  // 담자마자 새로고침하면 올리기(디바운스)가 끝나기 전이라, 그대로 받아오면
  // 방금 담은 게 서버의 옛 내용으로 지워집니다.
  const serverAt = Date.parse(rows[0].updated_at || "") || 0;
  const localAt = Date.parse(touchedAt || "") || 0;
  if (localAt > serverAt){
    await syncPush();
    return "이 기기의 최근 변경을 올렸습니다";
  }

  saved = rows[0].saved || [];
  compared = rows[0].compared || [];
  const extra = rows[0].extra || {};
  applied = extra.applied || [];
  notes = extra.notes || {};
  appliedInfo = extra.appliedInfo || {};
  memos = extra.memos || [];
  store.write(KEY_SAVED, saved);
  store.write(KEY_COMPARE, compared);
  store.write(KEY_APPLIED, applied);
  store.write(KEY_NOTES, notes);
  store.write(KEY_APPINFO, appliedInfo);
  store.write(KEY_MEMOS, memos);
  tabLabels(); render();
  return `받아옴 — 저장 ${saved.length}건 · 비교 ${compared.length}건 · 지원 ${applied.length}건`;
}

// extra 컬럼(메모·지원완료)이 없는 스키마에서도 나머지는 계속 동기화되게 합니다.
let syncHasExtra = true;

function pushBody(){
  const body = {
    code: syncCode,
    saved: slim(saved),
    compared: slim(compared),
    updated_at: new Date().toISOString(),
  };
  if (syncHasExtra) body.extra = {applied: slim(applied), notes, appliedInfo, memos};
  return body;
}

async function syncPush(){
  const body = pushBody();
  const res = await fetch(`${SYNC.url}/rest/v1/job_lists`, {
    method: "POST",
    headers: {...syncHeaders(), "Prefer": "resolution=merge-duplicates"},
    body: JSON.stringify(body),
  });
  if (res.ok){
    // 올린 시각을 로컬 기준으로 삼아야, 다음 받아오기에서 서버가 더 최신으로 보입니다.
    touchedAt = body.updated_at;
    store.write(KEY_TOUCHED, touchedAt);
    return;
  }
  if (syncHasExtra && res.status === 400){
    // 테이블에 extra 컬럼이 없는 경우. 저장·비교만이라도 계속 맞춥니다.
    syncHasExtra = false;
    syncStatus("메모·지원완료는 동기화 안 됨 (테이블에 extra 컬럼 추가 필요)");
    return syncPush();
  }
  throw new Error(`올리기 실패 (${res.status})`);
}

function syncStatus(text){
  const node = document.getElementById("syncMsg");
  if (node) node.textContent = text;
}

// 담기/빼기가 연달아 일어나도 마지막 한 번만 올립니다.
function syncSoon(){
  // 서버를 안 쓰더라도 "이 기기가 언제 바뀌었는지"는 남겨둡니다.
  touchedAt = new Date().toISOString();
  store.write(KEY_TOUCHED, touchedAt);

  if (!SYNC || !syncCode) return;
  clearTimeout(syncTimer);
  syncStatus("올리는 중…");
  syncTimer = setTimeout(() => {
    syncTimer = null;
    syncPush().then(() => syncStatus("동기화됨")).catch(e => syncStatus(e.message));
  }, 500);
}

// 올리기를 기다리는 중에 페이지를 떠나면 그 변경이 사라집니다.
// 떠나는 순간엔 보통 fetch가 취소되므로 keepalive로 보냅니다.
window.addEventListener("pagehide", () => {
  if (!SYNC || !syncCode || !syncTimer) return;
  clearTimeout(syncTimer);
  syncTimer = null;
  try {
    fetch(`${SYNC.url}/rest/v1/job_lists`, {
      method: "POST",
      headers: {...syncHeaders(), "Prefer": "resolution=merge-duplicates"},
      body: JSON.stringify(pushBody()),
      keepalive: true,
    });
  } catch (e) { /* 떠나는 중이라 더 할 수 있는 게 없습니다 */ }
});

function renderSyncBox(){
  const box = document.getElementById("syncBox");
  box.replaceChildren();

  if (!SYNC){
    // 동기화가 설정되지 않은 빌드 — 링크로 옮기는 방법만 제공합니다.
    box.appendChild(el("p", "hint",
      "이 목록은 브라우저에 저장돼서 폰에서는 안 보입니다. 링크를 만들어 폰에서 열면 옮겨집니다."));
    const b = el("button", "btn ghost", "옮길 링크 만들기");
    b.onclick = shareLink;
    box.appendChild(b);
    const msg = el("p", "hint");
    msg.id = "syncMsg";
    box.appendChild(msg);
    return;
  }

  if (syncCode){
    box.appendChild(el("p", "hint",
      "폰에서도 이 코드를 넣으면 담고 지운 게 자동으로 같아집니다."));
    const code = document.createElement("input");
    code.type = "text"; code.readOnly = true; code.value = syncCode;
    code.setAttribute("aria-label", "동기화 코드");
    code.onclick = () => code.select();
    box.appendChild(code);

    const row = el("div", "syncrow");
    const copy = el("button", "btn ghost", "코드 복사");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(syncCode); syncStatus("코드를 복사했습니다"); }
      catch (e) { code.select(); syncStatus("코드를 길게 눌러 복사하세요"); }
    };
    const pull = el("button", "btn ghost", "지금 받아오기");
    pull.onclick = () => syncPull().then(syncStatus).catch(e => syncStatus(e.message));
    row.append(copy, pull);
    box.appendChild(row);

    const off = el("button", "btn ghost", "연결 끊기");
    off.onclick = () => {
      syncCode = "";
      store.write(KEY_CODE, "");
      renderSyncBox();
      syncStatus("연결을 끊었습니다. 목록은 이 기기에 그대로 있습니다.");
    };
    box.appendChild(off);
  } else {
    box.appendChild(el("p", "hint",
      "폰과 PC에서 같은 코드를 쓰면 저장리스트·비교함이 자동으로 같아집니다."));
    const input = document.createElement("input");
    input.type = "text"; input.id = "codeInput";
    input.placeholder = "다른 기기에서 만든 코드 붙여넣기";
    box.appendChild(input);

    const row = el("div", "syncrow");
    const join = el("button", "btn ghost", "연결");
    join.onclick = () => {
      const v = input.value.trim().toLowerCase();
      if (!v) { syncStatus("코드를 넣어주세요"); return; }
      syncCode = v; store.write(KEY_CODE, v);
      renderSyncBox();
      syncPull(false).then(syncStatus).catch(e => syncStatus(e.message));
    };
    const make = el("button", "btn", "새 코드 만들기");
    make.onclick = () => {
      syncCode = newCode(); store.write(KEY_CODE, syncCode);
      renderSyncBox();
      syncPush().then(() => syncStatus("올렸습니다. 폰에 이 코드를 넣으세요."))
        .catch(e => syncStatus(e.message));
    };
    row.append(join, make);
    box.appendChild(row);
  }

  const msg = el("p", "hint");
  msg.id = "syncMsg";
  box.appendChild(msg);
}

async function shareLink(){
  if (!saved.length && !compared.length && !applied.length && !memos.length){
    showMsg("옮길 목록이 없습니다. 공고를 먼저 담아주세요.");
    return;
  }
  try {
    const code = await packShare({s: slim(saved), c: slim(compared),
                                  a: slim(applied), n: notes, i: appliedInfo, m: memos});
    const link = location.origin + location.pathname + "#sync=" + code;
    shareUrl.value = link;
    shareUrl.hidden = false;
    let copied = false;
    try {
      await navigator.clipboard.writeText(link);
      copied = true;
    } catch (e) { /* https가 아니거나 권한이 없으면 조용히 넘어갑니다 */ }
    showMsg(`저장 ${saved.length}건 · 비교 ${compared.length}건` +
      (copied ? " — 링크를 복사했습니다. 폰으로 보내서 열면 됩니다."
              : " — 아래 링크를 길게 눌러 복사하세요."));
  } catch (e) {
    showMsg("링크를 만들지 못했습니다: " + e.message);
  }
};

async function importShare(){
  const m = location.hash.match(/^#sync=(.+)$/);
  if (!m) return;
  // 새로고침할 때마다 다시 묻지 않도록 주소부터 정리합니다.
  history.replaceState(null, "", location.pathname);
  try {
    const got = await unpackShare(decodeURIComponent(m[1]));
    const s = got.s || [], c = got.c || [], a = got.a || [];
    const ok = confirm(
      `받은 목록: 저장 ${s.length}건 · 비교 ${c.length}건 · 지원 ${a.length}건\n` +
      `이 기기의 현재 목록(저장 ${saved.length}건 · 비교 ${compared.length}건)을 덮어씁니다.\n\n계속할까요?`
    );
    if (!ok) return;
    saved = s; compared = c; applied = a;
    notes = got.n || {}; appliedInfo = got.i || {}; memos = got.m || [];
    store.write(KEY_SAVED, saved);
    store.write(KEY_COMPARE, compared);
    store.write(KEY_APPLIED, applied);
    store.write(KEY_NOTES, notes);
    store.write(KEY_APPINFO, appliedInfo);
    store.write(KEY_MEMOS, memos);
    tabLabels(); render();
    showMsg(`옮겨왔습니다 — 저장 ${saved.length}건 · 비교 ${compared.length}건`);
  } catch (e) {
    alert("링크를 읽지 못했습니다. 링크가 잘렸을 수 있습니다.\n" + e.message);
  }
}

// ── 필터 패널 (모바일: 아래에서 올라오는 시트) ──
const panel = document.getElementById("panel");
const backdrop = document.getElementById("backdrop");
const panelToggle = document.getElementById("panelToggle");

function openPanel(on){
  panel.classList.toggle("open", on);
  backdrop.hidden = !on;
  panelToggle.setAttribute("aria-expanded", String(on));
  // 시트가 떠 있는 동안 뒤 목록이 같이 스크롤되지 않게 막습니다.
  document.body.style.overflow = on ? "hidden" : "";
}

// 아래로 쓸어내려 닫기. 내용이 맨 위에 있을 때만 시트가 따라 내려오고,
// 그 외에는 평소처럼 필터 목록이 스크롤됩니다.
const CLOSE_DISTANCE = 90;   // 이만큼 내리면 닫습니다
const CLOSE_SPEED = 0.5;     // px/ms. 빠르게 튕기면 덜 내려도 닫히도록
const FLICK_MIN = 30;        // 튕김으로 칠 최소 거리. 없으면 살짝 스쳐도 닫힙니다
let dragFrom = null, dragAt = 0, dragMoved = 0, dragging = false;

panel.addEventListener("touchstart", (e) => {
  if (!panel.classList.contains("open") || e.touches.length !== 1) return;
  // 입력칸에서 시작한 터치는 글자 선택·커서 이동을 방해하지 않게 둡니다.
  if (e.target.closest("input, textarea, select")) return;
  dragFrom = e.touches[0].clientY;
  dragAt = e.timeStamp;
  dragMoved = 0;
  dragging = false;
}, {passive: true});

panel.addEventListener("touchmove", (e) => {
  if (dragFrom === null) return;
  const dy = e.touches[0].clientY - dragFrom;
  if (dy > 0 && panel.scrollTop <= 0){
    dragging = true;
    dragMoved = dy;
    panel.style.transition = "none";
    panel.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();   // 뒤 목록이 같이 밀리지 않게
  } else if (dragging){
    // 다시 위로 올리면 원위치
    dragMoved = Math.max(0, dy);
    panel.style.transform = `translateY(${dragMoved}px)`;
  }
}, {passive: false});

function endDrag(e){
  if (dragFrom === null) return;
  const speed = dragMoved / Math.max(1, e.timeStamp - dragAt);
  panel.style.transition = "";
  panel.style.transform = "";
  const flicked = dragMoved > FLICK_MIN && speed > CLOSE_SPEED;
  if (dragging && (dragMoved > CLOSE_DISTANCE || flicked)) openPanel(false);
  dragFrom = null;
  dragging = false;
}
panel.addEventListener("touchend", endDrag, {passive: true});
panel.addEventListener("touchcancel", endDrag, {passive: true});

panelToggle.onclick = () => openPanel(!panel.classList.contains("open"));
document.getElementById("panelClose").onclick = () => openPanel(false);
backdrop.onclick = () => openPanel(false);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  document.querySelectorAll(".menu").forEach(m => m.remove());
  document.querySelectorAll(".modal").forEach(m => m.remove());
  if (panel.classList.contains("open")) openPanel(false);
});
// 옵션 메뉴는 바깥을 누르면 닫습니다.
document.addEventListener("click", () => {
  document.querySelectorAll(".menu").forEach(m => m.remove());
});

// 시트를 열어둔 채 데스크톱 폭이 되면 패널이 상주 형태로 돌아가므로 상태를 정리합니다.
window.matchMedia("(min-width:900px)")
  .addEventListener("change", e => { if (e.matches) openPanel(false); });

switchView("all");
renderSyncBox();
importShare();

if (SYNC){
  if (syncCode) syncPull().then(syncStatus).catch(e => syncStatus(e.message));
  // 폰에서 담고 PC로 돌아왔을 때 새로고침 없이 최신 목록이 오도록.
  // 코드는 로드 뒤에 연결할 수도 있으므로 리스너는 항상 걸어두고 안에서 확인합니다.
  window.addEventListener("focus", () => {
    if (syncCode) syncPull().then(syncStatus).catch(() => {});
  });
}
</script>
