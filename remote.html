const KEY="jobboard_pw";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const km=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},base,512));
  const iv=b64(P.iv),ct=b64(P.data);
  const mk=await crypto.subtle.importKey("raw",km.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",mk,b64(P.tag),msg))throw new Error("bad password");
  const ek=await crypto.subtle.importKey("raw",km.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-CBC",iv},ek,ct);
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
const saved=localStorage.getItem(KEY);
if(saved){open_(saved).catch(()=>localStorage.removeItem(KEY));}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value;
  document.getElementById("msg").textContent="여는 중…";
  try{
    if(document.getElementById("rm").checked)localStorage.setItem(KEY,pw);
    await open_(pw);
  }catch(err){
    localStorage.removeItem(KEY);
    document.getElementById("msg").textContent="암호가 맞지 않아요";
  }
});
})();
